<svg xmlns="http://www.w3.org/2000/svg" width="340" height="385" viewBox="0 0 340 385" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Menu frame (Windows 11 dark, "Show more options" menu) -->
  <rect x="16" y="16" width="300" height="345" rx="8" fill="#2B2B2B" stroke="#454545" filter="url(#shadow)"/>

  <!-- Highlighted item: Open in Sourcetree -->
  <rect x="20" y="209" width="292" height="22" rx="4" fill="#3D3D3D"/>

  <!-- Icons -->
  <g fill="none" stroke="#CCCCCC" stroke-width="1.2">
    <rect x="29.5" y="190.5" width="14" height="11" rx="1.5"/>
    <path d="M32.5 194 L35 196 L32.5 198"/>
    <line x1="36.5" y1="198.5" x2="40" y2="198.5"/>
  </g>
  <image x="28.5" y="212" width="16" height="16" href="data:image/png;base64,"/>

  <!-- Labels -->
  <g fill="#FFFFFF">
    <text x="56" y="39">View</text>
    <text x="56" y="63">Sort by</text>
    <text x="56" y="87">Group by</text>
    <text x="56" y="111">Refresh</text>
    <text x="56" y="144">Customize this folder...</text>
    <text x="56" y="201">Open in Terminal</text>
    <text x="56" y="225">Open in Sourcetree</text>
    <text x="56" y="249">Undo Rename</text>
    <text x="56" y="282">Give access to</text>
    <text x="56" y="315">New</text>
    <text x="56" y="348">Properties</text>
  </g>
  <text x="56" y="177" fill="#787878">Paste</text>
  <text x="300" y="249" fill="#CCCCCC" text-anchor="end">Ctrl+Z</text>

  <!-- Submenu arrows -->
  <g fill="none" stroke="#CCCCCC" stroke-width="1.2">
    <path d="M297 30 L301 34 L297 38"/>
    <path d="M297 54 L301 58 L297 62"/>
    <path d="M297 78 L301 82 L297 86"/>
    <path d="M297 273 L301 277 L297 281"/>
    <path d="M297 306 L301 310 L297 314"/>
  </g>

  <!-- Separators -->
  <g stroke="#454545">
    <line x1="20" y1="122.5" x2="312" y2="122.5"/>
    <line x1="20" y1="155.5" x2="312" y2="155.5"/>
    <line x1="20" y1="260.5" x2="312" y2="260.5"/>
    <line x1="20" y1="293.5" x2="312" y2="293.5"/>
    <line x1="20" y1="326.5" x2="312" y2="326.5"/>
  </g>

  <!-- Mouse cursor -->
  <path d="M196 216 L196 233 L200 229 L203 236 L205.5 235 L202.5 228 L208 228 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
</svg>
